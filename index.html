px}.group{margin-top:20px;color:#486c76}.empty{text-align:center;padding:45px 20px}.error{background:#fff5e9;border:1px solid #efd2a5;padding:28px;border-radius:9px}.loading{padding:55px;text-align:center}footer{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);background:white;padding:22px 4%;color:#657d85;font-size:.8rem}.back{display:inline-block;margin-bottom:18px}.live{font-size:.82rem;margin-top:15px;color:#637c85}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#173b44;color:white;border-radius:8px;padding:12px 22px;z-index:10}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

const flag=code=>FLAGS[code]?`<img src="${FLAGS[code]}" alt="" width="40" height="28" style="object-fit:contain;vertical-align:middle;border:1px solid #dce7ea;border-radius:3px">`:"";
const link=p=>'#p='+encodeURIComponent(p.id);
const date=s=>s?new Date(s).toLocaleDateString('ar-SA'):'غير متوفر';
const counts=id=>TYPES.map(t=>data.files.filter(f=>f.type===t&&(!id||f.owner===id)).length);
const avatar=p=>`<span class="avatar" style="--accent:${colour(p)}">${e(p.name.replace(/^د\. /,'').split(' ').slice(0,2).map(w=>w[0]).join(''))}</span>`;
function table(files){return `<div class="scroll"><table><thead><tr><th>الدولة</th><th>المجلس / اللجنة / الملف</th><th>النوع</th><th>المسؤول الرئيسي</th><th><span class="sr-only">التفاصيل</span></th></tr></thead><tbody>${files.map(f=>{const p=person(f.owner);return `<tr><td><span class="flag" role="img" aria-label="${e(f.country)}">${flag(f.code)}</span>${e(f.country)}<small>${e(f.continent)}</small></td><td>${e(f.name)}${f.support?`<small>مساند: ${e(person(f.support)?.name||'غير متوفر')}</small>`:''}</td><td><span class="badge">${e(f.type)}</span></td><td><a class="person-link" href="${p?link(p):'#'}">${e(p?.name||'غير متوفر')}</a></td><td><a class="person-link" href="${p?link(p):'#'}">عرض بيانات المنسق ↖</a></td></tr>`}).join('')}</tbody></table></div>`}
function select(id,label,options){return `<select id="${id}" aria-label="${label}"><option value="">${label}</option>${options.map(o=>`<option value="${e(o[0])}" ${state[id]===o[0]?'selected':''}>${e(o[1])}</option>`).join('')}</select>`}
function filtered(){return data.files.filter(f=>(!state.continent||state.continent===f.continent)&&(!state.country||state.country===f.code)&&(!state.type||state.type===f.type)&&(!state.owner||state.owner===f.owner||state.owner===f.support)&&norm([f.name,f.country,person(f.owner)?.name,person(f.support)?.name].join(' ')).includes(norm(state.q)))}
function results(){const f=filtered();document.getElementById('n').textContent=f.length+' نتيجة';document.getElementById('results').innerHTML=f.length?table(f):'<div class="empty"><h3>لا توجد نتائج مطابقة</h3><p>جرّب اسم دولة أو منسق آخر، أو أزل عوامل التصفية.</p><button class="btn ghost" id="empty-reset">إعادة البحث</button></div>';document.getElementById('empty-reset')?.addEventListener('click',reset)}
function reset(){Object.keys(state).forEach(k=>state[k]='');home()}
function home(){const total=counts();document.getElementById('app').innerHTML=`<div class="heading"><div><small>التعاون الدولي / دليل المسؤوليات</small><h1>دليل منسقي المجالس واللجان الدولية</h1><p class="muted">ابحث عن الملف، وتواصل مع المنسق المسؤول.</p></div><div class="counter"><b>${data.files.length}</b>ملف دولي</div></div><section class="panel"><label class="sr-only" for="q">ابحث باسم الدولة أو المجلس أو اللجنة أو المنسق</label><input id="q" class="search" placeholder="ابحث باسم الدولة أو المجلس أو اللجنة أو المنسق" value="${e(state.q)}"><div class="filters">${select('continent','جميع القارات',[...new Set(data.files.map(f=>f.continent))].map(c=>[c,c]))}${select('country','جميع الدول',[...new Map(data.files.filter(f=>!state.continent||f.continent===state.continent).map(f=>[f.code,[f.code,f.country]])).values()].sort((a,b)=>a[1].localeCompare(b[1],'ar')))}${select('type','جميع أنواع الملفات',TYPES.map(t=>[t,t]))}${select('owner','جميع المنسقين',data.people.map(p=>[p.id,p.name]))}<button class="btn ghost" id="reset">إعادة ضبط</button></div></section><div class="section-title"><h2>المنسقون</h2><span class="muted">${data.people.length} منسقين · ${total[0]} مجلسًا · ${total[1]} لجنة · ${total[2]} ملف آخر</span></div><section class="cards">${data.people.map(p=>`<a class="card" style="--accent:${colour(p)}" href="${link(p)}">${avatar(p)}<h3>${e(p.name)}</h3><div class="counts">${counts(p.id).map((n,i)=>`<div><b>${n}</b><small>${['مجالس','لجان','أخرى'][i]}</small></div>`).join('')}</div><span class="card-action">عرض بيانات المنسق ↖</span></a>`).join('')}</section><section class="panel"><div class="section-title"><h2>دليل الملفات</h2><span id="n" class="muted" aria-live="polite"></span></div><div id="results"></div></section><div class="section-title"><p class="live">تم تحميل البيانات: ${e(loadedAt)}${updated?' · آخر تحديث للدليل: '+date(updated):''}</p><button class="btn ghost" id="refresh">تحديث البيانات</button></div>`;document.getElementById('q').addEventListener('input',ev=>{state.q=ev.target.value;results()});['continent','country','type','owner'].forEach(k=>document.getElementById(k).addEventListener('change',ev=>{state[k]=ev.target.value;if(k==='continent'){state.country='';home()}else results()}));document.getElementById('reset').addEventListener('click',reset);document.getElementById('refresh').addEventListener('click',load);results()}
function profile(id){const p=person(id);if(!p){document.getElementById('app').innerHTML='<section class="panel"><h1>المنسق غير موجود</h1><a href="#">العودة إلى الدليل</a></section>';return}const mine=data.files.filter(f=>f.owner===id),support=data.files.filter(f=>f.support===id);document.getElementById('app').innerHTML=`<a href="#" class="back">→ جميع المنسقين</a><section class="panel" style="border-top:4px solid ${colour(p)}"><div class="profile-top">${avatar(p)}<div><small>بيانات المنسق</small><h1>${e(p.name)}</h1><p class="muted">${e(p.title||'المسمى الوظيفي: غير متوفر')}</p></div></div><div class="contacts">${[['البريد الإلكتروني',p.email],['الهاتف',p.phone],['التحويلة الداخلية',p.extension],['المنسق البديل',person(p.backup)?.name]].map(([l,v])=>`<div><small>${l}</small><strong>${e(v||'غير متوفر')}</strong></div>`).join('')}</div><div class="actions">${p.email?`<a class="btn" href="mailto:${e(p.email)}">إرسال رسالة</a><button class="btn ghost" id="copy">نسخ البريد</button>`:''}${p.phone?`<a class="btn ghost" href="tel:${e(p.phone.replace(/[^+\d]/g,''))}">اتصال</a>`:''}<span class="muted">آخر تحديث: ${date(p.updated)}</span></div></section><div class="profile-stats">${counts(id).map((n,i)=>`<div><b>${n}</b>${['مجالس','لجان','ملفات أخرى'][i]}</div>`).join('')}</div><h2>الملفات حسب القارة</h2>${[...new Set(mine.map(f=>f.continent))].map(c=>`<section class="panel"><h2>${e(c)}</h2>${TYPES.map(t=>{const files=mine.filter(f=>f.continent===c&&f.type===t);return files.length?`<h3 class="group">${t==='مجلس'?'المجالس':t==='لجنة'?'اللجان':'الملفات الأخرى'} · ${files.length}</h3>${table(files)}`:''}).join('')}</section>`).join('')}${support.length?`<section class="panel"><h2>ملفات يشارك فيها بصفة مساند</h2>${table(support)}</section>`:''}`;document.getElementById('copy')?.addEventListener('click',()=>navigator.clipboard.writeText(p.email).then(()=>notify('تم نسخ البريد')).catch(()=>notify('تعذر النسخ؛ انسخ البريد يدويًا')))}
function notify(text){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=text;document.body.append(el);setTimeout(()=>el.remove(),3000)}
function render(){if(!data)return;const id=new URLSearchParams(location.hash.slice(1)).get('p');if(id)profile(id);else home()}
async function load(){document.getElementById('app').innerHTML='<p class="loading" role="status">جارٍ تحميل الدليل…</p>';try{const response=await fetch(BACKEND+'/api/directory',{credentials:'omit',cache:'no-store',signal:AbortSignal.timeout(20000)});if(!response.ok)throw Error('load');const result=await response.json();if(!Array.isArray(result.data?.people)||!Array.isArray(result.data?.files))throw Error('data');data=result.data;updated=result.updated||'';loadedAt=new Date().toLocaleString('ar-SA');render()}catch{document.getElementById('app').innerHTML='<section class="error"><h1>تعذر تحميل الدليل</h1><p>تحقق من الاتصال ثم حاول مجددًا.</p><button class="btn" id="retry">إعادة المحاولة</button></section>';document.getElementById('retry').addEventListener('click',load)}}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});load();
</script></body></html>
